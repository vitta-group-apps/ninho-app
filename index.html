<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Viewport & PWA ─────────────────────────────── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#99b4a7" />

    <link rel="manifest" href="/manifest.json" />

    <meta name="description" content="Regista o dia-a-dia do teu bebé. Sono, alimentação, fraldas, saúde e crescimento — tudo num só lugar." />
